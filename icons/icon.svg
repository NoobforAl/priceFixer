<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
  </defs>
  <!-- tile: edge to edge so the icon stays large at 16px -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <!-- price tag: the universal "price" shape -->
  <path d="M14 64 L48 30 H108 a8 8 0 0 1 8 8 V90 a8 8 0 0 1 -8 8 H48 Z" fill="#ffffff"/>
  <!-- tag hole -->
  <circle cx="40" cy="64" r="7" fill="#15803d"/>
  <!-- the honest price -->
  <text x="78" y="82" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="50" fill="#15803d">$6</text>
</svg>
