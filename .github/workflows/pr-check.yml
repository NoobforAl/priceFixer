name: PR Check

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  pr-check:
    name: Pull Request Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Check for changes in source files
      id: changes
      run: |
        if git diff --name-only origin/main...HEAD | grep -E '\.(ts|js|json)$'; then
          echo "source_changed=true" >> $GITHUB_OUTPUT
        else
          echo "source_changed=false" >> $GITHUB_OUTPUT
        fi
        
    - name: Type check
      if: steps.changes.outputs.source_changed == 'true'
      run: npm run type-check
      
    - name: Lint code
      if: steps.changes.outputs.source_changed == 'true'
      run: npm run lint
      
    - name: Check formatting
      if: steps.changes.outputs.source_changed == 'true'
      run: npm run format:check
      
    - name: Run tests with coverage
      if: steps.changes.outputs.source_changed == 'true'
      run: npm test -- --coverage --watchAll=false
      
    - name: Test build
      if: steps.changes.outputs.source_changed == 'true'
      run: npm run build
      
    - name: Comment PR with coverage
      if: steps.changes.outputs.source_changed == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          
          // Read coverage summary if it exists
          try {
            const coverage = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
            const totalCoverage = coverage.total;
            
            const comment = `
            ## 📊 Test Coverage Report
            
            | Metric | Percentage | Covered/Total |
            |--------|------------|---------------|
            | Lines | ${totalCoverage.lines.pct}% | ${totalCoverage.lines.covered}/${totalCoverage.lines.total} |
            | Functions | ${totalCoverage.functions.pct}% | ${totalCoverage.functions.covered}/${totalCoverage.functions.total} |
            | Branches | ${totalCoverage.branches.pct}% | ${totalCoverage.branches.covered}/${totalCoverage.branches.total} |
            | Statements | ${totalCoverage.statements.pct}% | ${totalCoverage.statements.covered}/${totalCoverage.statements.total} |
            
            ${totalCoverage.lines.pct >= 80 ? '✅' : '⚠️'} Overall coverage: **${totalCoverage.lines.pct}%**
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          } catch (error) {
            console.log('No coverage report found or error reading it:', error.message);
          }
