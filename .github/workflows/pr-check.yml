name: PR Check

on:
  pull_request:
    branches: [main, develop]

# The repository default token is read-only; the coverage comment needs to
# write to the pull request.
permissions:
  contents: read
  pull-requests: write

jobs:
  pr-check:
    name: Pull Request Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for changes in source files
        id: changes
        run: |
          if git diff --name-only origin/main...HEAD | grep -E '\.(ts|js|json|css|html)$'; then
            echo "source_changed=true" >> $GITHUB_OUTPUT
          else
            echo "source_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Type check
        if: steps.changes.outputs.source_changed == 'true'
        run: npm run type-check

      - name: Lint code
        if: steps.changes.outputs.source_changed == 'true'
        run: npm run lint

      - name: Lint CSS
        if: steps.changes.outputs.source_changed == 'true'
        run: npm run lint:css

      - name: Check for unused CSS
        if: steps.changes.outputs.source_changed == 'true'
        run: npm run css:unused

      - name: Check formatting
        if: steps.changes.outputs.source_changed == 'true'
        run: npm run format:check

      - name: Run tests with coverage
        if: steps.changes.outputs.source_changed == 'true'
        run: npm test -- --coverage --watchAll=false

      - name: Test build
        if: steps.changes.outputs.source_changed == 'true'
        run: npm run build

      - name: Comment PR with coverage
        if: steps.changes.outputs.source_changed == 'true'
        uses: actions/github-script@v9
        with:
          # One coverage comment per PR, found by its hidden marker and
          # updated on every push instead of adding a new comment each time.
          # Needs coverage/coverage-summary.json (the json-summary reporter in
          # jest.config.js). Fork PRs get a read-only token: that error is
          # logged, not fatal.
          script: |
            const fs = require('fs');
            const marker = '<!-- pr-coverage-report -->';

            try {
              const { total } = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
              const row = (label, metric) =>
                `| ${label} | ${metric.pct}% | ${metric.covered}/${metric.total} |`;
              const body = [
                marker,
                '## 📊 Test Coverage Report',
                '',
                '| Metric | Percentage | Covered/Total |',
                '| --- | --- | --- |',
                row('Lines', total.lines),
                row('Functions', total.functions),
                row('Branches', total.branches),
                row('Statements', total.statements),
                '',
                `${total.lines.pct >= 80 ? '✅' : '⚠️'} Overall coverage: **${total.lines.pct}%**`,
              ].join('\n');

              const target = {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              };
              const comments = await github.paginate(github.rest.issues.listComments, target);
              const existing = comments.find(comment => comment.body?.includes(marker));

              if (existing) {
                await github.rest.issues.updateComment({ ...target, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ ...target, body });
              }
            } catch (error) {
              console.log('Coverage comment skipped:', error.message);
            }
