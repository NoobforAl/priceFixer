name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint code
        run: npm run lint

      - name: Lint CSS
        run: npm run lint:css

      - name: Check for unused CSS
        run: npm run css:unused

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm test -- --coverage

      # Codecov rejects tokenless uploads, so the upload is skipped until a
      # CODECOV_TOKEN repository secret exists. `secrets` can't be used in
      # `if:`, and putting the token in job env would hand it to every step
      # (npm ci runs third-party install scripts), so this step exposes only
      # whether it is set.
      - name: Check for Codecov token
        id: codecov
        env:
          HAS_TOKEN: ${{ secrets.CODECOV_TOKEN != '' }}
        run: echo "has_token=$HAS_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Upload coverage to Codecov
        if: steps.codecov.outputs.has_token == 'true'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  build:
    name: Build Extension
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and package (Chrome + Firefox)
        run: npm run package

      - name: Check packaged files
        run: |
          for dir in dist dist-firefox; do
            for f in manifest.json background.js content.js popup.html popup.js options.html options.js ui-common.js ui.css; do
              test -f "$dir/$f" || { echo "missing $dir/$f"; exit 1; }
            done
            node -e "const m=require('./$dir/manifest.json'); if (m.options_ui?.page !== 'options.html') { console.error('$dir: options_ui missing'); process.exit(1); }"
          done

      - name: Upload Chrome extension artifact
        uses: actions/upload-artifact@v7
        with:
          name: price-fixer-chrome
          path: price-fixer-chrome.zip
          retention-days: 30

      - name: Upload Firefox extension artifact
        uses: actions/upload-artifact@v7
        with:
          name: price-fixer-firefox
          path: price-fixer-firefox.zip
          retention-days: 30
