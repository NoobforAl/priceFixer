name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Type check
      run: npm run type-check
      
    - name: Lint code
      run: npm run lint
      
    - name: Check formatting
      run: npm run format:check
      
    - name: Run tests
      run: npm test -- --coverage
      
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage/lcov.info
        fail_ci_if_error: false

  build:
    name: Build Extension
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build and package (Chrome + Firefox)
      run: npm run package

    - name: Check packaged files
      run: |
        for dir in dist dist-firefox; do
          for f in manifest.json background.js content.js popup.html popup.js options.html options.js ui-common.js; do
            test -f "$dir/$f" || { echo "missing $dir/$f"; exit 1; }
          done
          node -e "const m=require('./$dir/manifest.json'); if (m.options_ui?.page !== 'options.html') { console.error('$dir: options_ui missing'); process.exit(1); }"
        done
      
    - name: Upload Chrome extension artifact
      uses: actions/upload-artifact@v4
      with:
        name: price-fixer-chrome
        path: price-fixer-chrome.zip
        retention-days: 30
        
    - name: Upload Firefox extension artifact
      uses: actions/upload-artifact@v4
      with:
        name: price-fixer-firefox
        path: price-fixer-firefox.zip
        retention-days: 30
