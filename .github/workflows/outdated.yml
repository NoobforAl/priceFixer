name: Package updates

# Weekly check for newer versions of the npm packages we use
# (scripts/check-outdated.js). The report goes to the run summary and to a
# single tracking issue: opened or updated while updates exist, closed once
# everything is up to date. Nothing is upgraded automatically.

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: package-updates
  cancel-in-progress: true

jobs:
  outdated:
    name: Check for package updates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      # npm outdated compares against what is installed
      - name: Install dependencies
        run: npm ci

      - name: Check for newer versions
        run: npm run deps:outdated -- --out outdated.md

      - name: Update tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Package updates available
        run: |
          issue=$(gh issue list --state open --limit 100 --json number,title \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty")

          if [ -s outdated.md ]; then
            body="$(cat outdated.md)

          _Updated by the [Package updates workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) on $(date -u +%Y-%m-%d)._"

            if [ -n "$issue" ]; then
              gh issue edit "$issue" --body "$body"
              echo "Updated issue #$issue"
            else
              gh issue create --title "$TITLE" --body "$body"
            fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --comment "All packages are up to date."
            echo "Closed issue #$issue"
          else
            echo "All packages are up to date."
          fi
